<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#2a2d33;font-family:Inter,sans-serif;color:#fff;padding:24px;width:3920px}
.grid{display:grid;grid-template-columns:1920px 1920px;gap:32px 32px}
.cap{font-size:34px;color:#e6e9ef;margin:0 0 12px 4px}
.frame{width:1920px;height:1080px;background:#16181C;position:relative;overflow:hidden;border:2px solid #b9bec7}
svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{display:inline-flex;align-items:center;justify-content:center;border:2px solid #fff;border-radius:6px;
  padding:0 8px;height:36px;font-size:24px;font-weight:600;margin-right:4px}
/* top bar (0.158) */
.top{position:absolute;left:56px;right:56px;top:28px;height:64px;display:flex;align-items:center;gap:14px;font-size:32px}
.top span{padding:8px 18px;border-radius:12px;color:#e8ebf2}
.top .open{background:rgba(255,255,255,.16);color:rgba(255,255,255,.72)}
.top .sp{flex:1;padding:0}
/* hero */
.hero{position:absolute;left:72px;top:118px;width:1776px;height:820px;border-radius:28px;overflow:hidden;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),inset 0 0 30px rgba(0,0,0,.5)}
.hero .tx{position:absolute;left:60px;top:70px;width:1400px}
.meta{font-size:30px;display:flex;align-items:center;gap:8px;margin-top:22px;color:#fff}
.desc{font-size:28px;line-height:40px;color:#e9ecf2;margin-top:18px;width:1060px}
.hbtns{position:absolute;left:60px;bottom:64px;display:flex;gap:18px}
.hb{height:64px;padding:0 26px;border-radius:12px;display:flex;align-items:center;gap:12px;font-size:30px;font-weight:500}
.hb.f{background:#F4F6FB;color:#0B0D12}
.dots{position:absolute;left:50%;bottom:28px;display:flex;gap:12px;transform:translateX(-50%)}
.dots i{width:12px;height:12px;border-radius:6px;background:rgba(255,255,255,.4)}.dots i:first-child{background:#fff}
/* rows */
.rowh{position:absolute;left:96px;display:flex;gap:14px;align-items:center;font-size:32px;font-weight:500}
.cards{position:absolute;left:96px;display:flex;gap:24px}
.card{width:400px;flex:0 0 400px}
.pic{height:225px;border-radius:14px 14px 0 0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),inset 0 0 18px rgba(0,0,0,.5)}
/* tabs */
.tabs{position:absolute;left:72px;top:964px;display:flex;gap:14px;font-size:30px}
.tab{display:flex;gap:10px;align-items:center;padding:10px 20px;border-radius:12px;color:#e8ebf2}
.tab.c{background:rgba(255,255,255,.16);color:rgba(255,255,255,.72)}
/* player */
.clock{position:absolute;right:72px;top:60px;font-size:40px;font-weight:400}
.ptx{position:absolute;left:72px;top:56px}
.ptx .meta{font-size:32px;margin-top:20px}
.bar{position:absolute;left:72px;right:72px;top:600px;height:72px;display:flex;align-items:center;gap:28px;font-size:30px}
.track{flex:1;height:6px;background:rgba(255,255,255,.3);border-radius:3px;position:relative}
.track b{position:absolute;left:0;top:0;height:6px;width:26%;background:#fff;border-radius:3px}
.track i{position:absolute;left:26%;top:-15px;width:36px;height:36px;border-radius:18px;background:#fff;margin-left:-18px}
.ptabs{position:absolute;left:72px;top:700px;display:flex;gap:14px;font-size:30px}
.pcards{position:absolute;left:72px;top:790px;display:flex;gap:24px}
.pc{width:400px;height:225px;border-radius:14px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),inset 0 0 18px rgba(0,0,0,.5);
  position:relative;flex:0 0 400px}
.pc div{position:absolute;left:18px;bottom:20px}.pc b{display:block;font-size:28px;font-weight:600}
.pc em{display:block;font-style:normal;font-size:22px;color:#C9D3E6}
/* ===== the four title styles ===== */
.t{color:#F4F6FB}
.t .l1{display:none}
.s-block .t{font-family:'Inter Display';font-weight:900;text-transform:uppercase;letter-spacing:.005em;
  font-size:108px;line-height:.98}
.s-clean .t{font-family:'Inter Display';font-weight:700;letter-spacing:-.02em;font-size:104px;line-height:1.02}
.s-two .t{font-family:'Inter Display';font-weight:800;letter-spacing:-.015em;font-size:100px;line-height:1.02}
.s-two .t .l1{display:block;font-family:Inter;font-weight:600;font-size:30px;letter-spacing:.34em;
  text-transform:uppercase;margin-bottom:10px;color:#E2E6EE}
.s-two .t .l1:empty{display:none}
.s-bold .t{font-family:'Inter Display';font-weight:800;text-transform:uppercase;letter-spacing:.07em;
  font-size:88px;line-height:1.06}
.player .t{font-size:84px}.s-bold.player .t{font-size:72px}.s-two.player .t .l1{font-size:26px}
</style></head><body><div class="grid" id="g"></div>
<script>
const P=location.hash.slice(1)||'home';
const S=[['block','A · Modern block'],['clean','B · Bold clean'],['two','C · Two-line'],['bold','D · Modern bold']];
const ic={play:'<svg width="28" height="28" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>',
 info:'<svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
 more:'<svg width="28" height="28" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/></svg>',
 cw:'<svg width="32" height="32" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg>',
 det:'<svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
 ext:'<svg width="28" height="28" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M7 4l3 3M17 4l-3 3"/></svg>',
 mlt:'<svg width="28" height="28" viewBox="0 0 24 24"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>',
 ch:'<svg width="28" height="28" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
 ep:'<svg width="28" height="28" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M10 9l4 2-4 2z"/></svg>',
 pause:'<svg width="30" height="30" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="2.6"/></svg>',
 gear:'<svg width="30" height="30" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>'};
const bg=(h,x,y)=>`radial-gradient(ellipse 60% 70% at ${x}% ${y}%,hsla(${h},35%,45%,.85),hsla(${h},30%,14%,.95) 60%,#121418 100%)`;
const title=(l1,l2)=>`<div class="t"><span class="l1">${l1}</span>${l2}</div>`;
// For styles other than Two-line the full title is shown; Two-line splits off the lead-in.
const T=(st,full,l1,l2)=>st==='two'?title(l1,l2):title('',full);
function topBar(open){return `<div class="top">${['Home','Movies','TV Shows','Documentaries'].map(w=>
 `<span class="${w===open?'open':''}">${w}</span>`).join('')}<span class="sp"></span><span>Files</span><span>Search</span>
 <span>Settings</span><span>21:40</span></div>`}
function home(st){return topBar('Home')+`<div class="hero" style="background:${bg(32,72,45)}"><div class="tx">
 ${T(st,'Harrow Point: The Long Winter','Harrow Point','The Long Winter')}
 <div class="meta"><span class="badge">15</span>2025 · 3 seasons · Drama, Mystery</div>
 <div class="desc">A lighthouse keeper's daughter returns to the island she fled, the winter the ferry stops running
 and the first of the old families goes missing.</div></div>
 <div class="hbtns"><div class="hb f">${ic.play}Resume S3 E2 · 31 min left</div><div class="hb">${ic.info}More info</div></div>
 <div class="dots"><i></i><i></i><i></i><i></i><i></i></div></div>
 <div class="rowh" style="top:986px">${ic.cw}Continue Watching</div>
 <div class="cards" style="top:1040px">${[200,120,260,330,170].map((h,i)=>`<div class="card"><div class="pic"
 style="background:${bg(h,50,40)}"></div></div>`).join('')}</div>`}
function details(st){return topBar('Movies')+`<div class="hero" style="background:${bg(210,62,40)}"><div class="tx">
 ${T(st,'The Last Crossing','','The Last Crossing')}
 <div class="meta"><span class="badge">15</span>2025 · 2 h 11 min · Drama, Thriller</div>
 <div class="desc">A ferryman who knows every current of the strait agrees to carry one last passenger across, and
 finds the whole town waiting on the other side.</div></div>
 <div class="hbtns"><div class="hb f">${ic.play}Play</div><div class="hb">${ic.more}More</div></div></div>
 <div class="tabs"><div class="tab c">${ic.det}Details</div><div class="tab">${ic.ext}Extras</div>
 <div class="tab">${ic.mlt}More Like This</div></div>`}
function player(st){return `<div style="position:absolute;inset:0;background:${bg(30,55,40)}"></div>
 <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,0) 35%,
 rgba(0,0,0,0) 45%,rgba(0,0,0,.75))"></div><div class="clock">21:40</div>
 <div class="ptx">${st==='two'?title('','Marshals'):title('','Marshals')}
 <div class="meta"><span class="badge">15</span>Season 1 · Episode 5 · Wind River</div></div>
 <div class="bar"><div class="hb" style="padding:0 20px">${ic.pause}</div><div class="track"><b></b><i></i></div>
 <span>46:12 · Ends 22:26</span><div class="hb">${ic.gear}Settings</div></div>
 <div class="ptabs"><div class="tab c">${ic.ch}Chapters</div><div class="tab">${ic.ep}Episodes</div></div>
 <div class="pcards">${[['Recap','From 0:00',30],['Chapter 1','From 1:06',210],['Intro','From 6:13',0],
 ['Chapter 2','Playing · from 7:13',140],['Chapter 3','From 19:40',270]].map(c=>`<div class="pc"
 style="background:${bg(c[2],50,40)}"><div><b>${c[0]}</b><em>${c[1]}</em></div></div>`).join('')}</div>`}
const F={home,details,player};
document.getElementById('g').innerHTML=S.map(([k,n])=>`<div><div class="cap">${n}</div>
 <div class="frame s-${k} ${P}">${F[P](k)}</div></div>`).join('');
</script></body></html>
