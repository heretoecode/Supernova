<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#2a2c31;font-family:Roboto,Inter,Arial,sans-serif;width:2040px;padding:40px}
.frame{border:2px solid #c9ccd3;background:#111215;padding:36px 40px 44px;display:grid;
 grid-template-columns:240px repeat(6,236px);column-gap:26px;row-gap:30px;align-items:center}
.lbl{color:#e8ebf2;font-size:22px;text-align:center}
.rl{color:#e8ebf2;font-size:22px;line-height:30px}
.crop{position:relative;width:236px;height:170px;border-radius:12px 12px 0 0;overflow:hidden;
 background:radial-gradient(ellipse 70% 60% at 70% 30%,rgba(255,255,255,.18),transparent 60%),linear-gradient(155deg,#2f5c4a,#0e1d17)}
.edge{position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.badge{position:absolute;top:8px;right:8px;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.45)}
.badge svg{position:absolute;left:0;top:0}
</style></head><body><div class="frame" id="f"></div>
<script>
const D=48,C=24;
function pt(p,r){const a=2*Math.PI*p-Math.PI/2;return [C+r*Math.cos(a),C+r*Math.sin(a)]}
function pie(p,r){if(p>=1)return `<circle cx="${C}" cy="${C}" r="${r}" fill="#000"/>`;
 const [x,y]=pt(p,r),large=p>.5?1:0;return `<path d="M${C} ${C} L${C} ${C-r} A${r} ${r} 0 ${large} 1 ${x} ${y} Z" fill="#000"/>`}
function tick(){return `<path d="M15 24.5l6 6 12-13" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`}
const rows=[["A · Fills to the edge",r=>24],["B · Fills inside a white rim",r=>18]];
const vals=[.1,.25,.4,.75,.9,'w'];
let h='<div></div>'+vals.map(v=>`<div class="lbl">${v==='w'?'Watched':Math.round(v*100)+'%'}</div>`).join('');
rows.forEach(([name,rf])=>{h+=`<div class="rl">${name}</div>`;vals.forEach(v=>{
 const inner=v==='w'?tick():pie(v,rf());
 h+=`<div class="crop"><div class="edge"></div><div class="badge" style="overflow:hidden"><svg width="${D}" height="${D}" viewBox="0 0 ${D} ${D}">${inner}</svg></div></div>`})});
document.getElementById('f').innerHTML=h;
</script></body></html>
