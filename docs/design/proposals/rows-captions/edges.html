<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#2a2c31;font-family:Roboto,Inter,Arial,sans-serif;width:2400px;padding:40px}
.frame{position:relative;border:2px solid #c9ccd3;background:#111215;padding:34px 40px 50px;margin-bottom:40px;overflow:hidden}
.frame>canvas{position:absolute;left:0;top:0;z-index:0}
.frame>*:not(canvas){position:relative;z-index:1}
.title{color:#e8ebf2;font-size:26px;font-weight:500;margin-bottom:24px}
.row{display:flex;gap:60px;justify-content:center;align-items:flex-start}
.group{display:flex;flex-direction:column;align-items:center}
.lbl{color:#e8ebf2;font-size:21px;margin-bottom:18px;white-space:nowrap}
.pair{display:flex;gap:26px;padding:16px}
.poster{position:relative;width:236px;border-radius:12px;background:#1c1e23}
.art{position:relative;height:354px;border-radius:12px 12px 0 0;overflow:hidden}
.edge{position:absolute;inset:0;border-radius:12px;pointer-events:none}
.logo{position:absolute;left:8px;right:8px;bottom:40px;text-align:center;font-size:25px;font-weight:900;letter-spacing:2px}
.cap{height:100px;padding:9px 8px 0 14px}
.t1{color:#fff;font-size:24px;font-weight:500;line-height:28px}
.t2,.t3{color:#c9d3e6;font-size:18px;line-height:22px;margin-top:6px}
</style></head><body><div id="f"></div>
<script>
const LIGHT="radial-gradient(ellipse 70% 60% at 60% 30%,rgba(255,255,255,.55),transparent 65%),linear-gradient(155deg,#d9cfb8,#9c8f74)";
const DARK="radial-gradient(ellipse 70% 60% at 70% 30%,rgba(255,255,255,.12),transparent 60%),linear-gradient(155deg,#1d2a3a,#07090d)";
function poster(art,name,ink,edgeCss,scale){
 return `<div class="poster" style="${scale?'transform:scale(1.08);margin:0 10px':''}"><div class="art" style="background:${art}"><div class="logo" style="color:${ink}">${name.toUpperCase()}</div></div>
 <div class="cap"><div class="t1">${name}</div><div class="t2">2 seasons · 16 episodes</div><div class="t3">Added 16 Nov 2026</div></div>
 <div class="edge" style="${edgeCss}"></div></div>`}
// rest edge: white line + inner shade (6 px at 25% black), applied to the artwork part only in the app; here round the whole card as built
function rest(w,a){return `box-shadow:inset 0 0 0 ${w}px rgba(255,255,255,${a}),inset 0 0 0 ${w+6}px rgba(0,0,0,.25)`}
const rests=[["Today: 1.5 px at 60%",1.5,.6],["Solid white, 1 px",1,1],["Solid white, 1.5 px",1.5,1],["Solid white, 2 px",2,1]];
const rings=[["Today: 6 px",6],["4 px",4],["3 px",3],["2 px",2]];
let h=`<div class="frame"><div class="title">1 · The line at rest (with today's soft shade inside it)</div><div class="row">`;
rests.forEach(([l,w,a])=>{h+=`<div class="group"><div class="lbl">${l}</div><div class="pair">${poster(LIGHT,"Harbour","#2a2418",rest(w,a))}${poster(DARK,"Nightfall","#f4f6fa",rest(w,a))}</div></div>`});
h+=`</div></div><div class="frame"><div class="title">2 · The focus ring (solid white; the card grows 8%)</div><div class="row">`;
rings.forEach(([l,w])=>{h+=`<div class="group"><div class="lbl">${l}</div><div class="pair" style="padding:30px 24px">${poster(DARK,"Nightfall","#f4f6fa",`box-shadow:0 0 0 ${w}px #fff`,true)}</div></div>`});
h+=`</div></div>`;
document.getElementById('f').innerHTML=h;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
document.querySelectorAll('.frame').forEach(fr=>{const w=fr.clientWidth,hh=fr.clientHeight;const cv=document.createElement('canvas');cv.width=w;cv.height=hh;fr.prepend(cv);
 const g=cv.getContext('2d'),r=rng(20261118),n=w*hh*20/1000;for(let i=0;i<n;i++){const x=r()*w|0,y=r()*hh|0,a=r()<1/7?.45:.07+r()*.15;g.fillStyle=`rgba(255,255,255,${a})`;g.fillRect(x,y,1,1)}});
</script></body></html>
