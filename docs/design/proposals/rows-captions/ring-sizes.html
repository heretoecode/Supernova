<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#2a2c31;font-family:Roboto,Inter,Arial,sans-serif;width:1100px;padding:40px}
.frame{position:relative;border:2px solid #c9ccd3;background:#111215;padding:40px 60px 50px;display:grid;
 grid-template-columns:repeat(3,236px);column-gap:80px;row-gap:34px;justify-content:center}
.lbl{color:#e8ebf2;font-size:22px;white-space:nowrap;text-align:center;margin-bottom:12px}
.poster{position:relative;width:236px;height:462px;border-radius:12px;overflow:hidden;background:#1c1e23}
.art{position:absolute;left:0;right:0;top:0;height:354px;border-radius:12px 12px 0 0;overflow:hidden;
 background:radial-gradient(ellipse 70% 60% at 70% 30%,rgba(255,255,255,.18),transparent 60%),linear-gradient(155deg,#2f5c4a,#0e1d17)}
.edge{position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),inset 0 0 18px rgba(0,0,0,.45)}
.logo{position:absolute;left:8px;right:8px;bottom:40px;text-align:center;font-size:25px;color:#f4f6fa;font-weight:900;letter-spacing:2px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.cap{position:absolute;left:16px;right:12px;top:367px}
.t1{color:#fff;font-size:24px;font-weight:500}
.t2,.t3{color:#c9d3e6;font-size:19px;margin-top:3px}
.badge{position:absolute;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.45)}
.badge svg{position:absolute;left:0;top:0}
</style></head><body><div class="frame" id="f"></div>
<script>
const sizes=[[36,"Small · 36 px"],[48,"Medium · 48 px"],[60,"Large · 60 px"]];
function badge(d,p){const r=d*0.3,sw=d*0.12,c=2*Math.PI*r,m=d*0.17;
 return `<div class="badge" style="width:${d}px;height:${d}px;top:${m}px;right:${m}px"><svg width="${d}" height="${d}" viewBox="0 0 ${d} ${d}">
 <circle cx="${d/2}" cy="${d/2}" r="${r}" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="${sw}"/>
 <circle cx="${d/2}" cy="${d/2}" r="${r}" fill="none" stroke="#000" stroke-width="${sw}" stroke-linecap="round"
  stroke-dasharray="${c*p} ${c}" transform="rotate(-90 ${d/2} ${d/2})"/></svg></div>`}
let h='';
[[.4,"S1 E4 · 5 of 8 left"],[.1,"S1 E2 · 9 of 10 left"]].forEach(([p,line])=>{
 sizes.forEach(([d,l])=>{h+=`<div><div class="lbl">${l} · ${Math.round(p*100)}%</div><div class="poster"><div class="art"><div class="logo">GREENWOOD</div><div class="edge"></div>${badge(d,p)}</div>
 <div class="cap"><div class="t1">Greenwood</div><div class="t2">${line}</div><div class="t3">Added 16 Nov 2026</div></div></div></div>`})});
document.getElementById('f').innerHTML=h;
</script></body></html>
