<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111215;font-family:Roboto,Inter,Arial,sans-serif;width:1920px}
.screen{position:relative;width:1920px;height:1080px;overflow:hidden}
.screen>canvas{position:absolute;left:0;top:0}
.border{position:absolute;inset:0;border:2px solid #c9ccd3;z-index:9}
.cell{position:absolute;width:476px;height:1076px;overflow:hidden}
.cell .lbl{position:absolute;left:16px;top:14px;color:#e8ebf2;font-size:21px;white-space:nowrap;z-index:6;background:rgba(17,18,21,.85);padding:2px 10px;border-radius:6px}
.tb{position:absolute;left:30px;top:56px;display:flex;gap:8px;color:#fff;font-size:26px}
.tb span{height:52px;padding:0 22px;border-radius:20px;display:flex;align-items:center}
.tb .f{background:#fff;color:#000}
.line{position:absolute;left:30px;right:0;top:132px;height:2px;background:rgba(255,255,255,.12)}
.poster{position:absolute;width:236px;border-radius:12px;background:#23262C;box-shadow:inset 0 0 0 1px #fff}
.art{height:354px;border-radius:12px 12px 0 0}
.cap{height:100px;padding:9px 8px 0 14px}
.t1{color:#fff;font-size:24px;font-weight:500;line-height:28px}
.t2,.t3{color:#c9d3e6;font-size:18px;line-height:22px;margin-top:6px}
.menu{position:absolute;left:30px;top:116px;width:330px;border-radius:16px;background:rgba(22,24,28,.99);padding:14px 0;z-index:5}
.menu .h{color:#c9d3e6;font-size:20px;text-align:center;padding:6px 0 10px}
.menu .i{height:58px;display:flex;align-items:center;gap:12px;padding:0 20px;color:#fff;font-size:22px;white-space:nowrap}
.menu .i.on{background:#fff;color:#000;margin:0 10px;border-radius:12px;padding:0 14px}
.menu .i b{margin-left:auto;font-weight:400;color:#c9d3e6;font-size:20px}
.menu .i.on b{color:#333}
</style></head><body>
<div class="screen" id="s"></div>
<script>
const arts=[["#7a3b2e","#26120d"],["#2f5c4a","#0e1d17"],["#5a4a7a","#1a1426"],["#8a6a2a","#2a1f0a"]];
const names=["The Harbour","Greenwood","Night Shift","Golden Mile"];
const variants=[
 ["1 · Today: no outline","none"],
 ["2 · Outline, white at 25%","0 0 0 1.5px rgba(255,255,255,.25)"],
 ["3 · Outline, white at 50%","0 0 0 1.5px rgba(255,255,255,.5)"],
 ["4 · Dark shadow, no outline","0 0 0 1px rgba(0,0,0,.6),0 18px 48px 12px rgba(0,0,0,.85)"]];
let h='';
variants.forEach(([l,sh],k)=>{const x=2+k*480,y=2;
 let c=`<div class="cell" style="left:${x}px;top:${y}px"><div class="lbl">${l}</div>
 <div class="tb"><span class="f">⚲ Filters</span><span>⇅ Sort</span></div><div class="line"></div>`;
 for(let i=0;i<4;i++){const a=arts[i];c+=`<div class="poster" style="left:${30+(i%2)*263}px;top:${158+Math.floor(i/2)*500}px"><div class="art" style="background:radial-gradient(ellipse 70% 60% at 70% 30%,rgba(255,255,255,.18),transparent 60%),linear-gradient(155deg,${a[0]},${a[1]})"></div><div class="cap"><div class="t1">${names[i]}</div><div class="t2">2 seasons · 16 episodes</div><div class="t3">Added 16 Nov 2026</div></div></div>`}
 c+=`<div class="menu" style="box-shadow:${sh}"><div class="h">Filters</div>
 <div class="i on">◉ Watched<b>All</b></div><div class="i">◈ Genre<b>Any</b></div><div class="i">◷ Year<b>Any</b></div><div class="i">▣ Streaming services<b>Any</b></div><div class="i">⌫ Clear filters</div><div class="i">✦ Unwatched only<b>35</b></div><div class="i">★ Highly rated<b>12</b></div><div class="i">⌂ In progress<b>4</b></div></div></div>`;
 h+=c});
const s=document.getElementById('s');s.innerHTML=h+'<div class="border"></div>';
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const cv=document.createElement('canvas');cv.width=1920;cv.height=1080;s.prepend(cv);
const g=cv.getContext('2d'),r=rng(20261118),n=1920*1080*20/1000;g.fillStyle='#111215';g.fillRect(0,0,1920,1080);
for(let i=0;i<n;i++){const x=r()*1920|0,y=r()*1080|0,a=r()<1/7?.45:.07+r()*.15;g.fillStyle=`rgba(255,255,255,${a})`;g.fillRect(x,y,1,1)}
g.fillStyle='#3a3d44';for(let k=1;k<4;k++)g.fillRect(k*480,0,3,1080);
</script></body></html>
