<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;color:#fff;width:1920px;height:1080px;overflow:hidden}
#f{width:1920px;height:1080px;position:relative;overflow:hidden}canvas{position:absolute;inset:0;width:1920px;height:1080px;image-rendering:pixelated}
svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{position:absolute;left:56px;right:56px;top:28px;height:64px;display:flex;align-items:center;gap:14px;font-size:32px}
.top span{padding:8px 18px;border-radius:12px;color:#e8ebf2}.top .open{background:rgba(255,255,255,.16);color:rgba(255,255,255,.72)}
.top .sp{flex:1;padding:0}
.tabs{position:absolute;left:56px;top:130px;display:flex;gap:14px;font-size:32px}
.tab{display:flex;gap:12px;align-items:center;padding:10px 20px;border-radius:12px;color:#e8ebf2}
.tab.c{background:rgba(255,255,255,.16);color:rgba(255,255,255,.72)}
.cnt{display:inline-flex;width:34px;height:34px;border-radius:17px;background:#F4F6FB;color:#0B0D12;font-size:22px;
  font-weight:600;align-items:center;justify-content:center}
.list{position:absolute;left:56px;right:56px}
.h{display:flex;gap:14px;align-items:center;font-size:32px;font-weight:500;margin:64px 0 26px 20px}
.h:first-child{margin-top:0}
.row{height:120px;display:flex;align-items:center;padding:0 28px;border-bottom:2px solid rgba(255,255,255,.08);border-radius:14px}
.row:last-child{border-bottom:0}
.row .ic{width:48px;color:#e8ebf2}.row .nm{flex:1;padding-left:26px}
.row .nm b{display:block;font-size:36px;font-weight:500}.row .nm i{display:block;font-style:normal;font-size:27px;color:#C9D3E6}
.pill{width:200px;height:48px;border:2px solid rgba(255,255,255,.7);border-radius:24px;display:flex;align-items:center;
  justify-content:center;font-size:25px;margin-right:auto;margin-left:40px}
.chev{width:40px;color:#C9D3E6}
.row.f{background:#F4F6FB;color:#0B0D12;border-bottom-color:transparent}.row.f .nm i{color:#3a4150}
.row.f .pill{border-color:#0B0D12}.row.f .ic{color:#0B0D12}
.btn{height:60px;padding:0 22px;border-radius:12px;display:flex;align-items:center;gap:10px;font-size:28px;margin-left:12px}
.btn.p{background:#0B0D12;color:#fff}
.chips{display:flex;gap:10px;font-size:30px}.chips span{padding:8px 18px;border-radius:12px}
.chips .on{border:2px solid rgba(255,255,255,.75)}.row.f .chips .on{background:#0B0D12;color:#fff;border-color:#0B0D12}
.sw{width:76px;height:40px;border-radius:20px;background:#E2E6EE;position:relative}
.sw:after{content:'';position:absolute;right:5px;top:5px;width:30px;height:30px;border-radius:15px;background:#0B0D12}
.hero{position:absolute;left:72px;top:118px;width:1776px;height:620px;border-radius:28px;overflow:hidden;
  background:radial-gradient(ellipse 60% 80% at 72% 45%,hsla(32,35%,45%,.9),hsla(32,30%,14%,.97) 60%,#121418 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),inset 0 0 30px rgba(0,0,0,.5)}
.t{position:absolute;left:60px;top:64px;font-family:'Inter Display';font-weight:900;font-size:100px;line-height:.98;
  text-transform:uppercase;color:#F4F6FB}
.meta{position:absolute;left:60px;top:270px;font-size:30px;display:flex;align-items:center;gap:8px}
.badge{display:inline-flex;align-items:center;justify-content:center;border:2px solid #fff;border-radius:6px;
  padding:0 8px;height:36px;font-size:24px;font-weight:600;margin-right:4px}
.desc{position:absolute;left:60px;top:326px;font-size:28px;line-height:40px;width:1060px;color:#e9ecf2}
.hb{position:absolute;bottom:56px;height:64px;padding:0 26px;border-radius:12px;display:flex;align-items:center;gap:12px;
  font-size:30px;font-weight:500}
.rowh{position:absolute;left:96px;display:flex;gap:14px;align-items:center;font-size:32px;font-weight:500}
.cards{position:absolute;left:96px;display:flex;gap:24px}.card{width:400px;flex:0 0 400px}
.pic{height:225px;border-radius:14px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),inset 0 0 18px rgba(0,0,0,.5)}

.top span{padding:6px 20px;border-radius:20px}
.tab{padding:8px 22px 8px 18px;border-radius:20px;height:56px}
.pill{height:52px;border-radius:20px;width:180px}
.btn{height:52px;border-radius:20px;padding:0 22px;font-size:27px}
.chips span{height:52px;display:flex;align-items:center;padding:0 22px;border-radius:20px}
.pane{position:absolute;left:32px;right:32px;top:218px;bottom:24px;border-radius:28px;background:rgba(22,24,28,.72)}
.list{z-index:1}
</style></head><body><div id="f"><canvas id="c" width="1920" height="1080"></canvas></div><script>
const [page,bgk,pane,dens]=(location.hash.slice(1)||'settings-medium-none-020').split('-');
const c=document.getElementById('c').getContext('2d');
if(bgk==='charcoal'){c.fillStyle='#16181C';c.fillRect(0,0,1920,1080)}else{
 // Medium speckle: fixed fine grains on a darker base; drawn once, never animated.
 const pp=dens?parseInt(dens)/1000:.02;
 const O={base:'#111215',p:pp,lo:.07,hi:.22,rare:pp*.135,rareA:.45};
 let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 c.fillStyle=O.base;c.fillRect(0,0,1920,1080);const img=c.getImageData(0,0,1920,1080),d=img.data;
 for(let i=0;i<1920*1080;i++){const r=rnd();let a=0;
  if(r<O.rare)a=O.rareA*(.7+.3*rnd());else if(r<O.p)a=O.lo+(O.hi-O.lo)*rnd()*rnd();
  if(a){const k=i*4;for(let j=0;j<3;j++)d[k+j]=d[k+j]+(232-d[k+j])*a}}
 c.putImageData(img,0,0)}
const I=(p,s=34)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24">${p}</svg>`;
const ic={dev:I('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/>'),
 srv:I('<rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/>'),
 cloud:I('<path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.5A3.5 3.5 0 0 0 7 18z"/>'),plus:I('<path d="M12 5v14M5 12h14"/>'),
 care:I('<path d="M3 12h4l3-7 4 14 3-7h4"/>'),lib:I('<path d="M5 20V10M10 20V4M15 20v-8M20 20H3"/>'),
 find:I('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'),chev:I('<path d="M9 6l6 6-6 6"/>',30),
 open:I('<path d="M3 7h6l2 2h10v10H3z"/>',28),speed:I('<path d="M4 16a8 8 0 0 1 16 0M12 16l4-5"/>'),
 pause:I('<path d="M9 5v14M15 5v14"/>'),res:I('<path d="M4 12a8 8 0 1 0 3-6.3M4 4v4h4"/>'),
 skip:I('<path d="M5 6l6 6-6 6M12 6l6 6-6 6"/>'),cred:I('<path d="M4 6h16M4 11h16M4 16h10"/>'),
 play:I('<path d="M7 4l13 8-13 8z"/>',28),info:I('<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',28),
 cw:I('<circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/>',32),
 pb:I('<path d="M7 4l13 8-13 8z"/>',30),au:I('<path d="M4 10v4h4l5 4V6L8 10z"/>',30),
 acc:I('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',30),sys:I('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/>',30)};
const topBar=open=>`<div class="top">${['Home','Movies','TV Shows','Documentaries'].map(w=>
 `<span class="${w===open?'open':''}">${w}</span>`).join('')}<span class="sp"></span>${['Files','Search','Settings'].map(w=>
 `<span class="${w===open?'open':''}">${w}</span>`).join('')}<span>21:40</span></div>`;
const row=(i,n,s,pill,end,f)=>`<div class="row${f?' f':''}"><div class="ic">${i}</div><div class="nm"><b>${n}</b><i>${s}</i></div>
 ${pill?`<div class="pill">${pill}</div>`:''}${end}</div>`;
const P={plain:()=>'',
files:()=>topBar('Files')+`<div class="tabs"><div class="tab">${ic.dev}This Device</div><div class="tab c">${ic.srv}Connections</div>
 <div class="tab">${ic.care}Library Care <span class="cnt">3</span></div><div class="tab">${ic.lib}Your Library</div></div>
 <div class="list" style="top:250px"><div class="h">${ic.srv}Your connections</div>
 ${row(ic.cloud,'Cloud drive · alex','WebDAV · 1,204 videos','Reachable',`<div class="chev">${ic.chev}</div>`)}
 ${row(ic.srv,'Home server · alex','SFTP · 512 videos','Reachable',`<div class="btn p">${ic.open}Open</div><div class="btn">Edit</div>
 <div class="btn">Test</div><div class="btn">Turn off</div><div class="btn">Remove</div>`,1)}
 ${row(ic.plus,'Add a connection','Computer or NAS, WebDAV, SFTP or FTP','',`<div style="margin-left:auto" class="chev">${ic.chev}</div>`)}
 <div class="h">${ic.find}Found on your network</div>
 ${row(ic.dev,'DESKTOP-7Q','Windows computer · SMB','New',`<div class="chev">${ic.chev}</div>`)}
 ${row(ic.srv,'Media box','SMB','New',`<div class="chev">${ic.chev}</div>`)}</div>`,
settings:()=>topBar('Settings')+`<div class="tabs"><div class="tab c">${ic.pb}Playback</div><div class="tab">${ic.au}Audio &amp; Subtitles</div>
 <div class="tab">${ic.lib}Library</div><div class="tab">${ic.acc}Accounts</div><div class="tab">${ic.sys}System</div></div>
 <div class="list" style="top:250px"><div class="h">${ic.pb}Playing</div>
 ${row(ic.speed,'Playback speed','For every video until you change it','',`<div class="chips" style="margin-left:auto">
 <span>0.75×</span><span class="on">1×</span><span>1.25×</span><span>1.5×</span></div>`)}
 ${row(ic.pause,'Hide controls when paused','Shows the picture without the bar over it','',`<div class="sw" style="margin-left:auto"></div>`)}
 ${row(ic.res,'Resume where you left off','When you start something you have half watched','',`<div class="chips" style="margin-left:auto">
 <span class="on">Ask</span><span>Always</span><span>Never</span></div>`,1)}
 <div class="h">${ic.skip}Skipping</div>
 ${row(ic.skip,'Intros','Opening titles and theme tune','',`<div class="chips" style="margin-left:auto"><span>Off</span>
 <span class="on">Button</span><span>Automatic</span></div>`)}
 ${row(ic.cred,'Credits','End credits · never cuts a scene after them','',`<div class="chips" style="margin-left:auto"><span>Off</span>
 <span>Button</span><span class="on">Automatic</span></div>`)}</div>`,
home:()=>topBar('Home')+`<div class="hero"><div class="t">Harrow Point:<br>The Long Winter</div>
 <div class="meta"><span class="badge">15</span>2025 · 3 seasons · Drama, Mystery</div>
 <div class="desc">A lighthouse keeper's daughter returns to the island she fled, the winter the ferry stops running and
 the first of the old families goes missing.</div>
 <div class="hb" style="left:60px;background:#F4F6FB;color:#0B0D12">${ic.play}Resume S3 E2 · 31 min left</div>
 <div class="hb" style="left:520px">${ic.info}More info</div></div>
 <div class="rowh" style="top:780px">${ic.cw}Continue Watching</div>
 <div class="cards" style="top:836px">${[12,210,120,330,170].map(h=>`<div class="card"><div class="pic" style="background:
 radial-gradient(ellipse 60% 70% at 50% 40%,hsla(${h},35%,45%,.85),hsla(${h},30%,14%,.95) 60%,#121418 100%)"></div></div>`).join('')}</div>`};
document.getElementById('f').insertAdjacentHTML('beforeend',(pane==='pane'?'<div class="pane"></div>':'')+P[page]());
</script></body></html>
