<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#2a2d33;font-family:Inter,sans-serif;color:#fff;padding:20px;width:3920px}
.grid{display:grid;grid-template-columns:1920px 1920px;gap:30px}
.cap{font-size:32px;color:#e6e9ef;margin:0 0 10px 4px}
.fr{width:1920px;height:1080px;position:relative;overflow:hidden;border:2px solid #b9bec7;
 background:radial-gradient(ellipse 70% 80% at 30% 50%,#4f7a4a,#2c4a3a 50%,#1b2a2e 100%)}
.sub{position:absolute;z-index:9;left:160px;bottom:90px;font-size:46px;font-weight:600;text-shadow:0 0 6px #000,0 0 2px #000}
.panel{position:absolute;right:56px;top:56px;width:820px;padding:18px 22px 22px;border-radius:26px;
 background:rgba(22,24,28,.99)}
.dim{filter:brightness(.6);transform:scale(.96);transform-origin:100% 50%}
svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:12px;font-size:28px;padding:0 4px;margin-bottom:22px}
.tab{height:52px;display:flex;align-items:center;gap:10px;padding:0 20px;border-radius:20px;color:#e8ebf2}
.tab.f{background:#F4F6FB;color:#0B0D12}.tab.o{background:rgba(255,255,255,.16);color:rgba(255,255,255,.72)}
.h{display:flex;align-items:center;gap:14px;font-size:22px;color:#C9D3E6;margin:16px 0 4px}.tabs+.h{margin-top:0}
.h:before,.h:after{content:'';flex:1;height:2px;background:rgba(255,255,255,.12)}
.r{height:62px;display:flex;align-items:center;gap:16px;padding:0 18px;border-radius:14px;font-size:27px}
.r+.r{border-top:2px solid rgba(255,255,255,.06)}
.r .ic{width:30px;display:flex;justify-content:center;color:#e8ebf2}
.r .n{flex:1;white-space:nowrap}
.r.f{background:#F4F6FB;color:#0B0D12;border-top-color:transparent}.r.f .ic{color:#0B0D12}
.r.f + .r{border-top-color:transparent}
.ch{display:flex;gap:4px}.ch span{white-space:nowrap;height:46px;display:flex;align-items:center;padding:0 16px;border-radius:20px;font-size:25px}
.ch .on{background:rgba(255,255,255,.18)}.r.f .ch .on{background:#0B0D12;color:#fff}.r.f .pill{border-color:#0B0D12}
.val{display:flex;align-items:center;gap:10px;font-size:26px}.val b{font-weight:500}
.pill{height:38px;padding:0 14px;border:2px solid rgba(255,255,255,.7);border-radius:20px;display:flex;align-items:center;font-size:21px}
.sw{width:66px;height:36px;border-radius:18px;background:#E2E6EE;position:relative}
.sw:after{content:'';position:absolute;right:4px;top:4px;width:28px;height:28px;border-radius:14px;background:#0B0D12}
.sw.off{background:rgba(255,255,255,.25)}.sw.off:after{left:4px;right:auto;background:#E2E6EE}
.dots{display:flex;gap:12px}.dots i{width:32px;height:32px;border-radius:16px;display:block}
.step{display:flex;align-items:center;gap:22px;font-size:26px}
.list{position:absolute;right:92px;top:300px;width:520px;padding:16px 0;border-radius:26px;background:rgba(22,24,28,.99);z-index:3}
.list .r{margin:0 14px}
</style></head><body><div class="grid" id="g"></div><script>
const I=p=>`<svg width="28" height="28" viewBox="0 0 24 24">${p}</svg>`;
const ic={cc:I('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 10.5a2 2 0 1 0 0 3M16 10.5a2 2 0 1 0 0 3"/>'),
 au:I('<path d="M4 10v4h4l5 4V6L8 10z"/>'),pb:I('<path d="M7 4l13 8-13 8z"/>'),list:I('<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>'),
 dl:I('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'),tm:I('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M10 2h4"/>'),
 aa:I('<path d="M4 18l4-12 4 12M5.5 14h5M15 18l3-8 3 8M16 15.5h4"/>'),col:I('<circle cx="12" cy="12" r="9"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="8" cy="14" r="1"/>'),
 vp:I('<path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4"/>'),ol:I('<rect x="4" y="4" width="16" height="16" rx="1" stroke-dasharray="2 2"/><path d="M9 16l3-8 3 8M10 13h4"/>'),
 bg:I('<rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 12l8-8M4 20L20 4M12 20l8-8"/>'),op:I('<path d="M12 3l6 8a6 6 0 1 1-12 0z"/>'),
 rp:I('<path d="M4 9h13l-3-3M20 15H7l3 3"/>'),note:I('<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>'),
 boost:I('<path d="M4 10v4h4l5 4V6L8 10zM17 9v6M14 12h6"/>'),moon:I('<path d="M20 14A8 8 0 1 1 10 4a7 7 0 0 0 10 10z"/>'),
 sp:I('<circle cx="12" cy="12" r="2"/><path d="M7 7a7 7 0 0 0 0 10M17 7a7 7 0 0 1 0 10"/>'),fmt:I('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9v-1h2M17 15v1h-2"/>'),
 spd:I('<path d="M4 16a8 8 0 0 1 16 0M12 16l4-5"/>'),q:I('<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5M12 17h.01"/>'),
 sk:I('<path d="M6 6l8 6-8 6zM18 6v12"/>'),chev:I('<path d="M9 6l6 6-6 6"/>')};
const tabs=o=>`<div class="tabs">${[['Subtitles',ic.cc],['Audio',ic.au],['Playback',ic.pb]].map(([n,i])=>
 `<div class="tab ${n===o?'o':''}">${i}${n}</div>`).join('')}</div>`;
const row=(i,n,end,f)=>`<div class="r${f?' f':''}"><div class="ic">${i}</div><div class="n">${n}</div>${end}</div>`;
const ch=(a,on)=>`<div class="ch">${a.map(x=>`<span class="${x===on?'on':''}">${x}</span>`).join('')}</div>`;
const val=(v,pills='')=>`<div class="val">${v}${pills}${ic.chev}</div>`;
const sw=on=>`<div class="sw${on?'':' off'}"></div>`;
const step=v=>`<div class="step"><span>−</span><b>${v}</b><span>+</span></div>`;
const h=t=>`<div class="h">${t}</div>`;
const uk='🇬🇧';
const subs=`${tabs('Subtitles')}${h('Subtitle Selection')}
 ${row(ic.cc,'Subtitles',sw(1))}
 ${row(ic.list,'Subtitle Track',val(`${uk} <b>English</b>`,'<span class="pill">Original</span><span class="pill">SDH</span>'),1)}
 ${row(ic.dl,'Download Subtitles',val(''))}
 ${row(ic.tm,'Subtitle Delay',step('0 ms'))}
 ${h('Subtitle Appearance')}
 ${row(ic.aa,'Text Size',ch(['Small','Medium','Large','Extra large'],'Medium'))}
 ${row(ic.col,'Text Colour',`<div class="dots">${['#F4F1E6','#F2D64B','#4CD6D0','#7ED957','#F28DB2'].map((c,i)=>`<i style="background:${c};${i?'':'box-shadow:0 0 0 3px #16181C,0 0 0 5px #fff'}"></i>`).join('')}</div>`)}
 ${row(ic.vp,'Vertical Position',step('Raised 5%'))}
 ${row(ic.ol,'Outline',sw(1))}
 ${row(ic.bg,'Background',sw(0))}
 ${row(ic.op,'Background Opacity',ch(['25%','50%','75%','100%'],'75%'))}
 ${h('For This Series')}
 ${row(ic.rp,'Use in every episode',sw(0))}`;
const audio=`${tabs('Audio')}${h('Audio Selection')}
 ${row(ic.note,'Audio Track',val(`${uk} <b>English</b>`,'<span class="pill">Dolby Digital Plus</span><span class="pill">5.1</span>'),1)}
 ${h('Audio Adjustments')}
 ${row(ic.tm,'Audio Delay',step('0 ms'))}
 ${row(ic.boost,'Audio Boost',ch(['Off','Low','Medium','High'],'Off'))}
 ${row(ic.moon,'Night Mode',sw(0))}
 ${row(ic.sp,'Spatial Audio',sw(0))}
 ${h('For This Series')}
 ${row(ic.rp,'Use in every episode',sw(0))}`;
const play=f=>`${tabs('Playback')}${h('Picture and Speed')}
 ${row(ic.fmt,'Format',ch(['Fit','Fill','Zoom','Stretch'],'Fit'))}
 ${row(ic.spd,'Speed',ch(['0.75×','1×','1.25×','1.5×','2×'],'1×'))}
 ${h('Playing On')}
 ${row(ic.moon,'Stop playing at',val('<b>Off</b>'),f)}
 ${row(ic.q,'Still watching?',val('<b>Off</b>'))}
 ${row(ic.rp,'Play mode',val('<b>Play next</b>'))}
 ${row(ic.sk,'Skip intros &amp; credits',ch(['Off','Show button','Automatic'],'Show button'))}
 ${h('For This Series')}
 ${row(ic.rp,'Use in every episode',sw(0))}`;
const stopList=`<div class="list">${h('Stop Playing At')}${[['Off',1],['End of this episode',0],['11:10',0],['11:40',0],['12:10',0],['00:10',0]]
 .map(([n,f])=>`<div class="r${f?' f':''}"><div class="n">${n}</div>${f?'✓':''}</div>`).join('')}</div>`;
const F=[['1 · Subtitles: narrower panel, no line under the tabs',subs,''],['2 · Audio',audio,''],
 ['3 · Playback: For This Series reads "Use in every episode"',play(1),''],['4 · OK on Stop playing at: its list on top',play(0),stopList]];
document.getElementById('g').innerHTML=F.map(([c,p,l])=>`<div><div class="cap">${c}</div><div class="fr">
 <div class="sub">Who you really are, and why you use it.</div><div class="panel${l?' dim':''}">${p}</div>${l}</div></div>`).join('');

document.querySelectorAll('.panel').forEach(p=>{if(p.scrollWidth>p.clientWidth+1)console.log('OVERFLOW panel');
 p.querySelectorAll('.r').forEach(r=>{if(r.scrollWidth>r.clientWidth+1)console.log('OVERFLOW row: '+r.textContent.trim().slice(0,40))})});
</script></body></html>
