<text x="28" y="432" font-family="sans-serif" font-size="13" fill="#d9e3ee" text-anchor="start">One transport centre · 12 dp group gaps · seek 24 dp target / 4 dp track</text>
<text x="28" y="453" font-family="sans-serif" font-size="12" fill="#d9e3ee" text-anchor="start">Bubble remains visible with HUD; measured within seek bounds, notch 4 dp, gap 2 dp</text>
<text x="28" y="474" font-family="sans-serif" font-size="12" fill="#d9e3ee" text-anchor="start">Total/Ends at widths shown are placeholders; real measured text precedes seek allocation</text>
<text x="28" y="650" font-family="sans-serif" font-size="13" fill="#d9e3ee" text-anchor="start">A: seek initial → Up Settings / Down Play-Pause; opposite direction returns to seek.</text>
<text x="28" y="674" font-family="sans-serif" font-size="13" fill="#d9e3ee" text-anchor="start">B: seek initial → Down buttons; Left/Right between buttons; Up returns to seek.</text>
<text x="28" y="698" font-family="sans-serif" font-size="12" fill="#d9e3ee" text-anchor="start">Both: Left/Right on seek retain existing seeking. Settings close restores its invoking control.</text>
<text x="28" y="722" font-family="sans-serif" font-size="12" fill="#ffd49a" text-anchor="start">Approval pending: geometry, A/B graph and paused Ends at presentation. No application HUD change.</text>
