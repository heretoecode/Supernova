name: Supernova 0.149 PR30 unsigned conformance
on:
  workflow_dispatch:
  push:
    branches: [codex/agreed-fixes-2026-11-01]
    paths: [.github/workflows/supernova-pr30-conformance.yml, '.github/build/next-*test-fixtures.patch', 'src/**', 'res/**', 'assets/**', 'tools/**', build.gradle, '.github/signing/*0149*', .github/build/record-supernova-0149-conformance.py, .github/build/verify-pr30-scope.py, .github/build/verify-owner-reference-preservation.py]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: nova/Video
          fetch-depth: 0
          persist-credentials: false
      - name: Java21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Download pinned source-built native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: supernova-0146-native-*
          path: native-artifacts
          run-id: 40843685431
          github-token: ${{ github.token }}
      - name: Prepare exact dependency source and verify native inputs
        run: |
          set -euo pipefail
          python3 nova/Video/.github/build/prepare-supernova146-workspace.py --root nova
          python3 nova/Video/.github/build/package-supernova146-native.py --root nova --artifacts native-artifacts --workspace "$RUNNER_TEMP/native146-packaging" 2>&1 | tee native146-packaging.log
          python3 nova/Video/.github/build/build-supernova146-jetty.py --workspace nova/Video/build/supernova146-jetty
          git -C nova/FileCoreLibrary apply "$GITHUB_WORKSPACE/nova/Video/.github/build/next-filecore-test-fixtures.patch"
          git -C nova/MediaLib apply "$GITHUB_WORKSPACE/nova/Video/.github/build/next-medialib-test-fixtures.patch"
      - name: Validate preserved release history and source contracts before compiling
        run: |
          python3 nova/Video/.github/build/verify-next-qa.py --root nova
          # The owner now authorises corrections to the previously frozen library,
          # settings and Reception sources. Preserve delivery identity and native inputs.
          git -C nova/Video diff --exit-code 02ba4b02 HEAD -- AndroidManifest.xml build.gradle settings.gradle gradle.properties assets/foundation .github/signing tools/native146 res/raw/keep.xml res/layout/player_controller_experimental.xml src/main/java/com/archos/mediacenter/video/player/PlayerController.java src/main/java/com/archos/mediacenter/video/player/PreviewHudTiming.java
          python3 nova/Video/.github/build/verify-owner-reference-preservation.py --video nova/Video
      - name: Complete application and library tests, lint and Java compilation (no APK)
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
          cd nova/Video
          chmod +x gradlew
          ./gradlew foundationDependencyInventory testNoamazonReleaseUnitTest :MediaLib:testReleaseUnitTest :FileCoreLibrary:testReleaseUnitTest lintNoamazonRelease compileNoamazonReleaseJavaWithJavac --continue \
            -PfoundationVerify -PsupernovaQa -Puniversal --no-daemon --no-build-cache --no-configuration-cache --max-workers=4 -x :FileCoreLibrary:ndkBuild -x :MediaLib:ndkBuild 2>&1 | tee build/supernova146-conformance.log
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Preserve exact runtime archives
        if: always()
        run: python3 nova/Video/.github/build/collect-supernova146-runtime.py --video nova/Video
      - name: Preserve complete release validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supernova-0149-conformance-evidence
          path: |
            native146-packaging.log
            ${{ runner.temp }}/native146-packaging/packaging-inputs.json
            nova/Video/build/supernova146-conformance.log
            nova/Video/build/test-results/**
            nova/Video/build/reports/lint-results*.*
            nova/Video/build/reports/preview-ui/**
            nova/Video/build/reports/settings-014*/**
            nova/Video/build/supernova146-runtime-review/**
            nova/Video/build/supernova146-jetty/evidence.json
            nova/MediaLib/build/test-results/**
            nova/FileCoreLibrary/build/test-results/**
            nova/supernova146-source-preparation.json
          if-no-files-found: warn
