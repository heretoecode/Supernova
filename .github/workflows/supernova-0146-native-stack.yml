name: Supernova 0.146 pinned native stack
on:
  workflow_dispatch:
  push:
    branches: [codex/supernova-0.146-upstream-completion-2026-10-28]
    paths: [.github/workflows/supernova-0146-native-stack.yml]
permissions:
  contents: read
jobs:
  native:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - name: Checkout exact native recipe source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install native build tools
        run: |
          set -euo pipefail
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y build-essential git curl unzip autoconf automake libtool meson ninja-build cmake nasm pkg-config autopoint gettext gperf
      - name: Build complete pinned native stack from official source
        run: |
          set -euo pipefail
          python3 .github/build/build-supernova146-native-stack.py --workspace "$RUNNER_TEMP/native146" --abi '${{ matrix.abi }}' --jobs 4 2>&1 | tee native146-build.log
      - name: Preserve native libraries, headers, receipts and failed build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supernova-0146-native-${{ matrix.abi }}
          compression-level: 0
          path: |
            ${{ runner.temp }}/native146/delivery/*
            ${{ runner.temp }}/native146/openssl/**/*.log
            ${{ runner.temp }}/native146/subtitles/**/*.log
            ${{ runner.temp }}/native146/codec-dependencies/**/*.log
            ${{ runner.temp }}/native146/ffmpeg/**/*.log
            native146-build.log
          if-no-files-found: warn
