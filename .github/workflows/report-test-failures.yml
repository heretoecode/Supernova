name: Report test failures from a run
# Diagnostic helper: prints only the failing test cases (with their messages) from the
# test-result XML that a conformance run already uploaded. No build, no secrets.
on:
  push:
    branches: [claude/supernova-github-access-yfhe89]
    paths: [.github/diagnostics/failures-request.json]
  workflow_dispatch:
    inputs:
      run_id:
        description: Run whose conformance evidence to inspect
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Resolve run
        id: run
        run: |
          if [ -n "${{ inputs.run_id }}" ]; then echo "id=${{ inputs.run_id }}" >> "$GITHUB_OUTPUT";
          else echo "id=$(python3 -c "import json;print(json.load(open('.github/diagnostics/failures-request.json'))['run_id'])")" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: supernova-*-conformance-evidence
          path: evidence
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Print compile errors only
        run: |
          python3 - <<'PY'
          import pathlib
          # Streamed line by line: a hung test can leave a log of several gigabytes.
          for path in sorted(pathlib.Path('evidence').rglob('*conformance.log')):
              count=0
              seen=set()
              previous_error=False
              with path.open(errors='replace') as log:
                  for line in log:
                      text=line.strip()
                      if previous_error:
                          print('     '+text[:200])
                          previous_error=False
                      if (' error: ' in text or text.endswith('FAILED')) and text not in seen and count < 300:
                          seen.add(text)
                          count+=1
                          print('E| '+text[-330:])
                          previous_error=' error: ' in text
              print(f'{count} compile error or failed-task lines in {path.name}')
      - name: Print where hung tests were (watchdog thread dumps)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import pathlib
          # The conformance watchdog dumps every test JVM after 50 minutes; print each test thread's app frames.
          for path in sorted(pathlib.Path('evidence').rglob('*.txt')) + sorted(pathlib.Path('evidence').rglob('*.log')):
              shown=0
              block=[]
              with path.open(errors='replace') as log:
                  for line in log:
                      if line.startswith('"'):
                          if any('com.archos' in b for b in block) and ('Test worker' in block[0] or 'main' in block[0]):
                              print('T| '+path.name+' '+block[0].strip()[:120])
                              for b in [b for b in block if 'com.archos' in b][:25]:
                                  print('     '+b.strip()[:200])
                              shown+=1
                          block=[line]
                          if shown >= 12:
                              break
                      elif block:
                          block.append(line)
          PY
      - name: Print failing tests only
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, pathlib
          total=failed=0
          for path in sorted(pathlib.Path('evidence').rglob('TEST-*.xml')):
              suite=ET.parse(path).getroot()
              for case in suite.findall('testcase'):
                  total+=1
                  for kind in ('failure','error'):
                      node=case.find(kind)
                      if node is None: continue
                      failed+=1
                      text=(node.text or '').strip().splitlines()
                      print(f"::error::{case.get('classname')}.{case.get('name')} [{kind}] {node.get('message','')[:300]}")
                      for line in text[:7]: print('    '+line[:300])
          print(f'{failed} failing of {total} test cases')
          PY
