name: Preview renders (real Android views)
# Runs only the requested Robolectric capture tests and publishes the PNGs they write to
# build/reports/** onto the 'previews/claude' branch, so changes can be inspected visually
# before any APK is built. No secrets, no APK, no signing.
on:
  push:
    branches: [claude/supernova-github-access-yfhe89]
    paths: [.github/diagnostics/preview-request.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: preview-renders
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: nova/Video
          fetch-depth: 1
      - name: Java21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Download pinned source-built native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: supernova-0146-native-*
          path: native-artifacts
          run-id: 40843685431
          github-token: ${{ github.token }}
      - name: Prepare dependency source
        run: |
          set -euo pipefail
          python3 nova/Video/.github/build/prepare-supernova146-workspace.py --root nova
          python3 nova/Video/.github/build/package-supernova146-native.py --root nova --artifacts native-artifacts --workspace "$RUNNER_TEMP/native146-packaging" > /dev/null
          python3 nova/Video/.github/build/build-supernova146-jetty.py --workspace nova/Video/build/supernova146-jetty
          git -C nova/FileCoreLibrary apply "$GITHUB_WORKSPACE/nova/Video/.github/build/next-filecore-test-fixtures.patch"
          git -C nova/MediaLib apply "$GITHUB_WORKSPACE/nova/Video/.github/build/next-medialib-test-fixtures.patch"
      - name: Run requested capture tests
        run: |
          set +e -uo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' > /dev/null
          cd nova/Video
          filters=$(python3 -c "import json;print(' '.join('--tests '+t for t in json.load(open('.github/diagnostics/preview-request.json'))['tests']))")
          chmod +x gradlew
          ./gradlew testNoamazonReleaseUnitTest $filters -PfoundationVerify -PsupernovaQa -Puniversal --no-daemon --max-workers=4 \
            -x :FileCoreLibrary:ndkBuild -x :MediaLib:ndkBuild > "$RUNNER_TEMP/gradle.log" 2>&1
          echo "exit=$?" > "$RUNNER_TEMP/test-exit"
          grep -E "FAILED|tests completed|BUILD" "$RUNNER_TEMP/gradle.log" | tail -40
          # Compiler errors, so a broken build explains itself.
          grep -E "\.java:[0-9]+: error:" -A3 "$RUNNER_TEMP/gradle.log" | head -120 | tee -a "$RUNNER_TEMP/test-exit"
          # Failing assertions, so a red run still explains itself (renders are published either way).
          python3 - <<'PY' | tee -a "$RUNNER_TEMP/test-exit"
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('build/test-results/**/*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      print(f"FAILED {case.get('classname')}.{case.get('name')}: {(bad.get('message') or '')[:400]}")
          PY
      - name: Publish renders to previews/claude
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/previews"; mkdir -p "$out"
          find nova/Video/build/reports -name '*.png' -newer nova/Video/.github/diagnostics/preview-request.json -exec cp {} "$out/" \; || true
          cp "$RUNNER_TEMP/test-exit" "$out/TEST_EXIT.txt"
          printf 'source=%s\nrendered=%s\n' "$SOURCE_SHA" "$(date -u +%FT%TZ)" > "$out/SOURCE.txt"
          cd "$out"; ls -1
          git init -q; git checkout -q -b previews/claude
          git config user.name "preview-renders"; git config user.email "actions@users.noreply.github.com"
          git add -A; git commit -q -m "Preview renders for $SOURCE_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previews/claude
