name: Supernova 0.136 signed QA
on:
  # Register this branch-owned workflow without running its protected signing job.
  push:
    branches: [codex/supernova-next-refinement-2026-10-10]
    paths: [.github/workflows/next-refinement-qa.yml]
  workflow_dispatch:
    inputs:
      public_receipt_run:
        description: 'Optional successful signed QA run to reverify its public APK artifact without rebuilding or signing'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: supernova-0136-signing
  cancel-in-progress: false
jobs:
  qa:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/supernova-next-refinement-2026-10-10' && inputs.public_receipt_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: supernova-foundation-signing
    env:
      SUPERNOVA_QA_SOURCE: ${{ github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the exact QA source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Java for PKCS12 validation and Android build
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
          # Deliberately no Gradle/signing cache.

      - name: Prepare existing pinned NOVA dependencies without Preview identity conversion
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential curl file git meson nasm ninja-build pkg-config unzip wget ffmpeg python3-yaml
          sudo apt-get install -y repo
          mkdir nova
          cd nova
          repo init -u https://github.com/nova-video-player/aos-AVP -b 9c5842b74ab180c99441ed23fdd5d508448388a7 -m v6_4.xml
          cp ../source/.github/build/nova-ci.xml .repo/manifests/v6_4.xml
          if ! repo sync --no-manifest-update -c -d -j 4; then
            git --git-dir=.repo/projects/native/prebuilt/ffmpeg.git fetch --depth=1 https://github.com/nova-video-player/prebuilt-ffmpeg.git 6ba0e9340cf725bede2e2f29d30c290a2ab8130e
            git --git-dir=.repo/projects/native/prebuilt/opus.git fetch --depth=1 https://github.com/nova-video-player/prebuilt-opus.git 27544063be93ee55c6ba58a2ebb32c106eb2e37b
            repo sync --no-manifest-update -c -d -j 4
          fi
          git -C Video fetch ../../source "$SUPERNOVA_QA_SOURCE"
          git -C Video checkout --detach FETCH_HEAD
          test "$(git -C Video rev-parse HEAD)" = "$SUPERNOVA_QA_SOURCE"
          git -C MediaLib apply ../Video/.github/build/medialib-preview40.patch
          git -C native/avos apply ../../Video/.github/build/avos-preview414.patch
          git -C FileCoreLibrary apply ../Video/.github/build/filecore-preview414.patch
          git -C FileCoreLibrary apply ../Video/.github/build/filecore-preview415.patch
          git -C MediaLib apply ../Video/.github/build/medialib-preview415.patch
          git -C MediaLib apply ../Video/.github/build/medialib-preview417.patch
          git -C MediaLib apply ../Video/.github/build/medialib-preview417-local.patch
          git -C native/avos apply ../../Video/.github/build/avos-supernova135.patch
          # prepare-preview.py is intentionally NOT called for Foundation.
          git -C MediaLib apply ../Video/.github/build/medialib-supernova135.patch
          git -C MediaLib apply ../Video/.github/build/medialib-next-refinement.patch
          python3 Video/.github/build/prepare-foundation.py .

      - name: Verify 0.136 provider and historical identity isolation
        run: python3 source/.github/build/verify-next-refinement.py --root nova

      - name: Rebuild and compare pinned LGPL FFmpeg before replacing dependency binaries
        run: |
          set -euo pipefail
          native_workspace="$RUNNER_TEMP/supernova-foundation-ffmpeg"
          python3 source/.github/build/build-foundation-ffmpeg.py --root nova --workspace "$native_workspace"
          python3 source/tools/verify_foundation_native_runtime.py --root nova --workspace "$native_workspace" \
            --test-workspace "$RUNNER_TEMP/supernova-foundation-native-tests"
          python3 source/.github/build/build-foundation-ffmpeg.py --root nova --workspace "$native_workspace" \
            --verify-existing --install --source-bundle

      - name: Repeat secret-free Foundation release tests and unsigned binary conformance
        env:
          OPERATION: verify
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;29.0.14206865'
          cd nova/Video
          chmod +x gradlew
          ./gradlew foundationDependencyInventory testNoamazonReleaseUnitTest lintNoamazonRelease assembleNoamazonRelease \
            -PfoundationVerify -PsupernovaQa -Puniversal --no-daemon --no-build-cache --no-configuration-cache --max-workers=4
          python3 .github/build/verify-foundation-runtime.py \
            --inventory build/foundation/runtime-artifacts.json --reviewed docs/foundation/RUNTIME_SBOM.json
          mapfile -t unsigned_apks < <(find build/outputs/apk/noamazon/release -maxdepth 1 -name '*.apk')
          test "${#unsigned_apks[@]}" -eq 1
          python3 .github/build/verify-next-refinement.py --root .. \
            --apk "${unsigned_apks[0]}" --apkanalyzer "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" \
            --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          python3 .github/build/verify-foundation-native-apk.py --apk "${unsigned_apks[0]}" \
            --evidence "$RUNNER_TEMP/supernova-foundation-ffmpeg/verified-native-build.json"
          # Check the complete reviewed suite and record binary proof before either operation.
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 .github/build/record-next-refinement-conformance.py --root .. --apk "${unsigned_apks[0]}" \
            --apkanalyzer "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" \
            --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --native-evidence "$RUNNER_TEMP/supernova-foundation-ffmpeg/verified-native-build.json" \
            --output "$RUNNER_TEMP/supernova-foundation-conformance.json"
      - name: Sign the exact tested APK with the existing upgrade certificate
        env:
          ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG || vars.ACTIONS_STEP_DEBUG }}
          SUPERNOVA_P12_BASE64: ${{ secrets.SUPERNOVA_P12_BASE64 }}
          SUPERNOVA_STORE_PASSWORD: ${{ secrets.SUPERNOVA_STORE_PASSWORD }}
          SUPERNOVA_KEY_ALIAS: ${{ secrets.SUPERNOVA_KEY_ALIAS }}
          SUPERNOVA_KEY_PASSWORD: ${{ secrets.SUPERNOVA_KEY_PASSWORD }}
          SUPERNOVA_CERT_SHA256: 79ed34c52c3e359756ade0634d7bbb6f8e94e42a059020c1220bd8c7092a9f5e
        run: |
          set +x
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/supernova-foundation-signing"
          signing_log="$RUNNER_TEMP/supernova-0136-signing.log"
          trap 'rm -rf -- "$signing_dir"; rm -f -- "$signing_log"' EXIT
          mapfile -t unsigned_apks < <(find nova/Video/build/outputs/apk/noamazon/release -maxdepth 1 -name '*.apk')
          test "${#unsigned_apks[@]}" -eq 1
          unsigned_apk="${unsigned_apks[0]}"
          python3 source/.github/signing/next_refinement_qa_signing.py \
            --evidence "$RUNNER_TEMP/supernova-foundation-conformance.json" --apk "$unsigned_apk"
          unset SUPERNOVA_P12_BASE64
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$build_tools/zipalign" -c -P 16 4 "$unsigned_apk"
          if ! "$build_tools/apksigner" sign --ks "$signing_dir/foundation.p12" --ks-type PKCS12 \
            --ks-pass env:SUPERNOVA_STORE_PASSWORD --ks-key-alias "$SUPERNOVA_KEY_ALIAS" \
            --key-pass env:SUPERNOVA_KEY_PASSWORD --out "$RUNNER_TEMP/supernova-0136-qa.apk" \
            "$unsigned_apk" > "$signing_log" 2>&1; then
            echo 'QA signing failed; secret-scope diagnostics are withheld.'
            exit 1
          fi
      - name: Verify the signed QA artifact and tested payload parity
        run: |
          set -euo pipefail
          mapfile -t unsigned_apks < <(find nova/Video/build/outputs/apk/noamazon/release -maxdepth 1 -name '*.apk')
          test "${#unsigned_apks[@]}" -eq 1
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          python3 source/.github/signing/verify_next_refinement_qa_apk.py \
            --apk "$RUNNER_TEMP/supernova-0136-qa.apk" --unsigned "${unsigned_apks[0]}" \
            --evidence "$RUNNER_TEMP/supernova-foundation-conformance.json" \
            --source nova/Video --apksigner "$build_tools/apksigner" \
            --apkanalyzer "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" --aapt2 "$build_tools/aapt2" \
            --publish "$RUNNER_TEMP/supernova-0136-qa-publish"
      - name: Always remove temporary signing material and secret-scope logs
        if: always()
        run: |
          python3 source/.github/signing/foundation_signing.py cleanup
          rm -f -- "$RUNNER_TEMP/supernova-0136-signing.log"
      - name: Upload signed QA APK and public evidence only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supernova-0136-signed-qa
          path: |
            ${{ runner.temp }}/supernova-0136-qa-publish/Supernova-0.136-Refinement-QA.apk
            ${{ runner.temp }}/supernova-0136-qa-publish/public-qa-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload corresponding FFmpeg source and public native evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supernova-0136-qa-ffmpeg-source
          path: |
            ${{ runner.temp }}/supernova-foundation-ffmpeg/Supernova-Foundation-FFmpeg-Source.tar.xz
            ${{ runner.temp }}/supernova-foundation-ffmpeg/verified-native-build.json
            ${{ runner.temp }}/supernova-foundation-ffmpeg/native-runtime-regression.json
          if-no-files-found: error
          retention-days: 30
  public-receipt:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/supernova-next-refinement-2026-10-10' && inputs.public_receipt_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a successful signed QA run from this exact branch
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          QA_RUN_ID: ${{ inputs.public_receipt_run }}
          QA_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          run_id = os.environ['QA_RUN_ID']
          if not re.fullmatch(r'[1-9][0-9]*', run_id):
              raise SystemExit('A numeric signed QA run ID is required.')
          result = subprocess.run(['gh', 'api', 'repos/' + os.environ['QA_REPOSITORY'] + '/actions/runs/' + run_id], capture_output=True, text=True)
          if result.returncode:
              raise SystemExit('Upstream run metadata could not be verified.')
          run = json.loads(result.stdout)
          if run['workflow_id'] != 380815425 or run['conclusion'] != 'success' or run['event'] != 'workflow_dispatch' or run['head_branch'] != 'codex/supernova-next-refinement-2026-10-10' or not re.fullmatch(r'[0-9a-f]{40}', run['head_sha']):
              raise SystemExit('Only a successful branch-owned signed QA run is accepted.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('source_sha=' + run['head_sha'] + '\nrun_id=' + run_id + '\n')
          PY
      - name: Checkout the exact published APK source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.upstream.outputs.source_sha }}
          path: Video
          persist-credentials: false
      - name: Download only the signed QA artifact from the verified run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: supernova-0136-signed-qa
          path: qa-artifact
          run-id: ${{ steps.upstream.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Java for public signature and manifest verification
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Reverify actual APK and publish only public receipt fields
        env:
          QA_SOURCE: ${{ steps.upstream.outputs.source_sha }}
          QA_RUN_ID: ${{ steps.upstream.outputs.run_id }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
          python3 - <<'PY'
          import importlib.util, json, os, sys, zipfile
          from pathlib import Path
          source = Path('Video').resolve()
          sys.path.insert(0, str(source / '.github/signing'))
          from verify_foundation_apk import verify
          apk = Path('qa-artifact/Supernova-0.136-Refinement-QA.apk')
          proof = json.loads(Path('qa-artifact/public-qa-evidence.json').read_text())
          certificate = '79ed34c52c3e359756ade0634d7bbb6f8e94e42a059020c1220bd8c7092a9f5e'
          tools = Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0'
          analyzer = Path(os.environ['ANDROID_HOME']) / 'cmdline-tools/latest/bin/apkanalyzer'
          receipt = verify(apk, str(tools / 'apksigner'), str(analyzer), certificate)
          spec = importlib.util.spec_from_file_location('qa_conformance', source / '.github/build/verify-next-refinement.py')
          conformance = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(conformance)
          receipt.update(conformance.binary(apk, str(analyzer), source, str(tools / 'aapt2')))
          with zipfile.ZipFile(apk) as archive:
              if archive.testzip() is not None or len(archive.namelist()) != len(set(archive.namelist())):
                  raise SystemExit('APK ZIP integrity verification failed.')
          expected = {'application_id': 'app.supernova.player', 'version_name': '0.136', 'version_code': 136, 'certificate_sha256': certificate, 'source_commit': os.environ['QA_SOURCE'], 'signed': True, 'qa_only': True, 'payload_matches_tested_unsigned': True}
          if any(proof.get(key) != value for key, value in expected.items()) or any(proof.get(key) != value for key, value in receipt.items()):
              raise SystemExit('Published APK differs from its exact-source signed evidence.')
          unsigned = proof['unsigned_conformance']
          if unsigned['source_commit'] != os.environ['QA_SOURCE'] or unsigned['unit_tests'] < 514 or any(unsigned[key] != 0 for key in ['unit_failures', 'unit_errors', 'unit_skips']) or unsigned['lint']['errors'] != 0:
              raise SystemExit('Complete passing unsigned conformance evidence required.')
          receipt.update(source_commit=os.environ['QA_SOURCE'], signed_qa_run_id=int(os.environ['QA_RUN_ID']), signed=True, apk_bytes=apk.stat().st_size, signature_verified=True, apk_zip_crc_verified=True, original_ci_payload_parity_verified=True, unit_tests=unsigned['unit_tests'], unit_failures=unsigned['unit_failures'], unit_errors=unsigned['unit_errors'], unit_skips=unsigned['unit_skips'], lint=unsigned['lint'], runtime_artifact_hashes_matched=unsigned['runtime_artifact_hashes_matched'], rebuilt_ffmpeg_libraries_matched=unsigned['rebuilt_ffmpeg_libraries_matched'], native_hashes_matched=unsigned['native_hashes_matched'], signed_upgrade_verified=False, physical_shield_verified=False)
          Path('public-qa-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print('PUBLIC_QA_RECEIPT_BEGIN')
          print(json.dumps(receipt, indent=2))
          print('PUBLIC_QA_RECEIPT_END')
          PY
      - name: Upload public verification receipt only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supernova-0136-qa-verification-receipt
          path: public-qa-receipt.json
          if-no-files-found: error
          retention-days: 30
