name: Supernova 0.155 unsigned conformance
# Run 2: APK engine check accepts the same library shipped in both modules. 0.155 engine release (arm64-only Shield build): app source of this branch + the reviewed prebuilt engine from native
# run 41848351713 (built from a8c82ae52; archive SHA-256 42e1990b…ae8c), installed with that commit's own packaging recipe.
# MediaLib/FileCore are prepared exactly as 0.154, without the retired avos source patches.
on:
  push:
    branches: [claude/supernova-github-access-yfhe89]
    paths: [.github/workflows/supernova-0155-conformance.yml]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
env:
  ENGINE_RUN: 41848351713
  ENGINE_SOURCE: a8c82ae523533e8dc92cc30c203212f08a491148
  ENGINE_ARCHIVE_SHA256: 42e1990bc5e584747242ecffc8d83d1244f55b9babf72ebeaa3a4be272d2e738
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: nova/Video
          fetch-depth: 0
          persist-credentials: false
      - name: Java21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Download the reviewed arm64 engine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: supernova-0156-native-arm64-v8a
          path: engine
          run-id: ${{ env.ENGINE_RUN }}
          github-token: ${{ github.token }}
      - name: Prepare dependency source and install the verified engine
        run: |
          set -euo pipefail
          python3 nova/Video/.github/build/prepare-supernova155-workspace.py --root nova
          git -C nova/Video worktree add --detach "$RUNNER_TEMP/engine-recipe" "$ENGINE_SOURCE"
          python3 "$RUNNER_TEMP/engine-recipe/.github/build/package-supernova156-native.py" --root nova \
            --archive engine/_temp/native156/delivery/Supernova_0.156_native_arm64-v8a.tar.gz \
            --archive-sha256 "$ENGINE_ARCHIVE_SHA256" --source-commit "$ENGINE_SOURCE" \
            --evidence "$RUNNER_TEMP/native155/packaging-inputs.json" 2>&1 | tee native155-packaging.log
          python3 nova/Video/.github/build/build-supernova146-jetty.py --workspace nova/Video/build/supernova146-jetty
          git -C nova/FileCoreLibrary apply "$GITHUB_WORKSPACE/nova/Video/.github/build/next-filecore-test-fixtures.patch"
          git -C nova/MediaLib apply "$GITHUB_WORKSPACE/nova/Video/.github/build/next-medialib-test-fixtures.patch"
      - name: Validate release history and source contracts before compiling
        run: python3 nova/Video/.github/build/verify-next-qa.py --root nova
      - name: Complete application and library tests, lint and unsigned APK build
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
          cd nova/Video
          chmod +x gradlew
          ./gradlew foundationDependencyInventory testNoamazonReleaseUnitTest :MediaLib:testReleaseUnitTest :FileCoreLibrary:testReleaseUnitTest lintNoamazonRelease assembleNoamazonRelease --continue \
            -PfoundationVerify -PsupernovaQa -Puniversal -Parm64only --no-daemon --no-build-cache --no-configuration-cache --max-workers=4 -x :FileCoreLibrary:ndkBuild -x :MediaLib:ndkBuild 2>&1 | tee build/supernova155-conformance.log
          python3 - <<'PYTOOLS'
          import unittest,json
          from pathlib import Path
          suite=unittest.defaultTestLoader.discover('tools',pattern='test_*.py')
          result=unittest.TextTestRunner(verbosity=1).run(suite)
          Path('build/tooling-results.json').write_text(json.dumps(dict(tests=result.testsRun,failures=len(result.failures),errors=len(result.errors),skipped=len(result.skipped))))
          if not result.wasSuccessful():raise SystemExit(1)
          PYTOOLS
          mapfile -t apks < <(find build/outputs/apk/noamazon/release -maxdepth 1 -name '*.apk')
          test "${#apks[@]}" = 1
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test "$("$analyzer" manifest application-id "${apks[0]}")" = app.supernova.player
          test "$("$analyzer" manifest version-name "${apks[0]}")" = 0.155
          test "$("$analyzer" manifest version-code "${apks[0]}")" = 155
          python3 .github/build/verify-supernova155-native-apk.py --apk "${apks[0]}" --evidence "$RUNNER_TEMP/native155/packaging-inputs.json" | tee build/native155-apk.txt
          mkdir -p "$GITHUB_WORKSPACE/delivery"
          cp "${apks[0]}" "$GITHUB_WORKSPACE/delivery/Supernova_0.155_unsigned.apk"
          python3 - "$GITHUB_WORKSPACE/delivery" <<'PYREC'
          import hashlib,json,subprocess,sys,os
          from pathlib import Path
          d=Path(sys.argv[1]);apk=d/'Supernova_0.155_unsigned.apk'
          rec={'schema':1,'version_name':'0.155','version_code':155,'application_id':'app.supernova.player',
               'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
               'unsigned_apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'unsigned_apk_bytes':apk.stat().st_size,
               'engine':{'run':int(os.environ['ENGINE_RUN']),'source_commit':os.environ['ENGINE_SOURCE'],'archive_sha256':os.environ['ENGINE_ARCHIVE_SHA256']},
               'native_check':Path('build/native155-apk.txt').read_text()}
          (d/'unsigned-conformance.json').write_text(json.dumps(rec,indent=2)+'\n');print(json.dumps(rec,indent=2))
          PYREC
      - name: Preserve complete release validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supernova-0155-conformance-evidence
          path: |
            native155-packaging.log
            ${{ runner.temp }}/native155/packaging-inputs.json
            nova/Video/build/supernova155-conformance.log
            nova/Video/build/tooling-results.json
            nova/Video/build/native155-apk.txt
            nova/Video/build/test-results/**
            nova/Video/build/reports/lint-results*.*
            nova/MediaLib/build/test-results/**
            nova/FileCoreLibrary/build/test-results/**
            nova/supernova155-source-preparation.json
          if-no-files-found: warn
      - name: Preserve exact unsigned payload and conformance receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supernova-0155-unsigned-candidate
          path: delivery/*
          if-no-files-found: error
          retention-days: 14
