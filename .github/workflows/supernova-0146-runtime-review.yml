name: Supernova 0.146 exact runtime review inputs
on:
  workflow_dispatch:
  push:
    branches: [codex/supernova-0.146-upstream-completion-2026-10-28]
    paths: [.github/workflows/supernova-0146-runtime-review.yml]
permissions:
  contents: read
jobs:
  runtime:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: nova/Video
          persist-credentials: false
      - name: Java21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned dependency source and reviewed patches
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,xml.etree.ElementTree as ET
          root=Path('nova').resolve()
          repositories={'MediaLib':('heretoecode/aos-MediaLib','5758074049bc153ac4967b4ecd21886469270076'),'FileCoreLibrary':('nova-video-player/aos-FileCoreLibrary','c4b760c55102c72d45f68b0d16999fc1f4f013a7'),'native/avos':('nova-video-player/aos-avos','2cf21c486c7bf244c49b78d2220197a6d75396dd')}
          for name,(repo,sha) in repositories.items():
              dest=root/name;dest.parent.mkdir(parents=True,exist_ok=True)
              subprocess.run(['git','clone','--filter=blob:none','--no-checkout','https://github.com/'+repo+'.git',str(dest)],check=True)
              subprocess.run(['git','-C',str(dest),'checkout','--detach',sha],check=True)
          PY
          python3 nova/Video/.github/build/prepare-supernova146-dependencies.py --root nova
      - name: Build exact Jetty source backport
        run: python3 nova/Video/.github/build/build-supernova146-jetty.py --workspace nova/Video/build/supernova146-jetty
      - name: Resolve exact release runtime without signing
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
          cd nova/Video
          chmod +x gradlew
          ./gradlew foundationDependencyInventory -PfoundationVerify -PsupernovaQa -Puniversal --no-daemon --no-build-cache --max-workers=4 -x :FileCoreLibrary:ndkBuild -x :MediaLib:ndkBuild
          python3 .github/build/collect-supernova146-runtime.py --video .
      - name: Preserve exact source and runtime review archives
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supernova-0146-android-source-integration
          path: |
            nova/Video/build/supernova146-runtime-review/**
            nova/Video/build/supernova146-jetty/evidence.json
            nova/Video/build/supernova146-jetty/compile.log
            nova/supernova146-source-preparation.json
          if-no-files-found: error
