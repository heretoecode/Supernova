name: Foundation signing setup and release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Inspect public alias, validate existing key, or build after Foundation readiness approval'
        type: choice
        required: true
        default: validate
        options: [inspect, validate, verify, prepare]

permissions:
  contents: read

concurrency:
  group: foundation-signing
  cancel-in-progress: false

jobs:
  foundation:
    if: github.ref == 'refs/heads/codex/foundation-release'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: supernova-foundation-signing
    env:
      # Explicitly approved APK source; workflow-only fixes must not change app bytes.
      FOUNDATION_APPROVED_SOURCE: 11766e59dd143798e0c76b6eb8d4b0f6c9e1dfb8
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Foundation source only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Fail closed before preparing any key or signed build
        if: inputs.operation != 'verify'
        env:
          ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG || vars.ACTIONS_STEP_DEBUG }}
          SUPERNOVA_P12_BASE64: ${{ secrets.SUPERNOVA_P12_BASE64 }}
          SUPERNOVA_STORE_PASSWORD: ${{ secrets.SUPERNOVA_STORE_PASSWORD }}
          SUPERNOVA_KEY_ALIAS: ${{ secrets.SUPERNOVA_KEY_ALIAS }}
          SUPERNOVA_KEY_PASSWORD: ${{ secrets.SUPERNOVA_KEY_PASSWORD }}
          SUPERNOVA_CERT_SHA256: ${{ vars.SUPERNOVA_CERT_SHA256 }}
          FOUNDATION_RELEASE_READY: ${{ vars.FOUNDATION_RELEASE_READY }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set +x
          set -euo pipefail
          python3 source/.github/signing/foundation_signing.py preflight --operation "$OPERATION"

      - name: Java for PKCS12 validation and Android build
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
          # Deliberately no Gradle/signing cache.

      - name: Inspect public alias or validate without building an APK
        if: inputs.operation == 'inspect' || inputs.operation == 'validate'
        env:
          ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG || vars.ACTIONS_STEP_DEBUG }}
          SUPERNOVA_P12_BASE64: ${{ secrets.SUPERNOVA_P12_BASE64 }}
          SUPERNOVA_STORE_PASSWORD: ${{ secrets.SUPERNOVA_STORE_PASSWORD }}
          SUPERNOVA_KEY_ALIAS: ${{ secrets.SUPERNOVA_KEY_ALIAS }}
          SUPERNOVA_KEY_PASSWORD: ${{ secrets.SUPERNOVA_KEY_PASSWORD }}
          SUPERNOVA_CERT_SHA256: ${{ vars.SUPERNOVA_CERT_SHA256 }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set +x
          set -euo pipefail
          python3 source/.github/signing/foundation_signing.py "$OPERATION"

      - name: Prepare existing pinned NOVA dependencies without Preview identity conversion
        if: inputs.operation == 'prepare' || inputs.operation == 'verify'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential curl file git meson nasm ninja-build pkg-config unzip wget ffmpeg
          sudo apt-get install -y repo
          mkdir nova
          cd nova
          repo init -u https://github.com/nova-video-player/aos-AVP -b 9c5842b74ab180c99441ed23fdd5d508448388a7 -m v6_4.xml
          cp ../source/.github/build/nova-ci.xml .repo/manifests/v6_4.xml
          if ! repo sync --no-manifest-update -c -d -j 4; then
            git --git-dir=.repo/projects/native/prebuilt/ffmpeg.git fetch --depth=1 https://github.com/nova-video-player/prebuilt-ffmpeg.git 6ba0e9340cf725bede2e2f29d30c290a2ab8130e
            git --git-dir=.repo/projects/native/prebuilt/opus.git fetch --depth=1 https://github.com/nova-video-player/prebuilt-opus.git 27544063be93ee55c6ba58a2ebb32c106eb2e37b
            repo sync --no-manifest-update -c -d -j 4
          fi
          git -C Video fetch ../../source "$FOUNDATION_APPROVED_SOURCE"
          git -C Video checkout --detach FETCH_HEAD
          test "$(git -C Video rev-parse HEAD)" = "$FOUNDATION_APPROVED_SOURCE"
          git -C MediaLib apply ../Video/.github/build/medialib-preview40.patch
          git -C native/avos apply ../../Video/.github/build/avos-preview414.patch
          git -C FileCoreLibrary apply ../Video/.github/build/filecore-preview414.patch
          git -C FileCoreLibrary apply ../Video/.github/build/filecore-preview415.patch
          git -C MediaLib apply ../Video/.github/build/medialib-preview415.patch
          git -C MediaLib apply ../Video/.github/build/medialib-preview417.patch
          git -C MediaLib apply ../Video/.github/build/medialib-preview417-local.patch
          # prepare-preview.py is intentionally NOT called for Foundation.
          python3 Video/.github/build/prepare-foundation.py .

      - name: Require completed Foundation provider and version isolation before key preparation
        if: inputs.operation == 'prepare' || inputs.operation == 'verify'
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" = 'prepare' ]; then
            python3 source/.github/build/verify-foundation.py --root nova --readiness
          else
            python3 source/.github/build/verify-foundation.py --root nova
          fi

      - name: Rebuild and compare pinned LGPL FFmpeg before replacing dependency binaries
        if: inputs.operation == 'prepare' || inputs.operation == 'verify'
        run: |
          set -euo pipefail
          native_workspace="$RUNNER_TEMP/supernova-foundation-ffmpeg"
          python3 source/.github/build/build-foundation-ffmpeg.py --root nova --workspace "$native_workspace"
          python3 source/tools/verify_foundation_native_runtime.py --root nova --workspace "$native_workspace" \
            --test-workspace "$RUNNER_TEMP/supernova-foundation-native-tests"
          python3 source/.github/build/build-foundation-ffmpeg.py --root nova --workspace "$native_workspace" \
            --verify-existing --install --source-bundle

      - name: Repeat secret-free Foundation release tests and unsigned binary conformance
        if: inputs.operation == 'prepare' || inputs.operation == 'verify'
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;29.0.14206865'
          cd nova/Video
          chmod +x gradlew
          ./gradlew foundationDependencyInventory testNoamazonReleaseUnitTest lintNoamazonRelease assembleNoamazonRelease \
            -PfoundationVerify -Puniversal --no-daemon --no-build-cache --no-configuration-cache --max-workers=4
          python3 .github/build/verify-foundation-runtime.py \
            --inventory build/foundation/runtime-artifacts.json --reviewed docs/foundation/RUNTIME_SBOM.json
          mapfile -t unsigned_apks < <(find build/outputs/apk/noamazon/release -maxdepth 1 -name '*.apk')
          test "${#unsigned_apks[@]}" -eq 1
          readiness_args=()
          if [ "$OPERATION" = 'prepare' ]; then readiness_args+=(--readiness); fi
          python3 .github/build/verify-foundation.py --root .. "${readiness_args[@]}" \
            --apk "${unsigned_apks[0]}" --apkanalyzer "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" \
            --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          python3 .github/build/verify-foundation-native-apk.py --apk "${unsigned_apks[0]}" \
            --evidence "$RUNNER_TEMP/supernova-foundation-ffmpeg/verified-native-build.json"
          # Keep the eventual signed-output directory unambiguous.
          if [ "$OPERATION" = 'prepare' ]; then
            rm -f -- "${unsigned_apks[0]}"
          else
            python3 -m unittest discover -s tools -p 'test_*.py'
            python3 .github/build/record-foundation-conformance.py --root .. --apk "${unsigned_apks[0]}" \
              --apkanalyzer "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" \
              --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2" \
              --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
              --native-evidence "$RUNNER_TEMP/supernova-foundation-ffmpeg/verified-native-build.json" \
              --output "$RUNNER_TEMP/supernova-foundation-conformance.json"
          fi

      - name: Prepare verified Foundation key and build release only
        if: inputs.operation == 'prepare'
        env:
          ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG || vars.ACTIONS_STEP_DEBUG }}
          SUPERNOVA_P12_BASE64: ${{ secrets.SUPERNOVA_P12_BASE64 }}
          SUPERNOVA_STORE_PASSWORD: ${{ secrets.SUPERNOVA_STORE_PASSWORD }}
          SUPERNOVA_KEY_ALIAS: ${{ secrets.SUPERNOVA_KEY_ALIAS }}
          SUPERNOVA_KEY_PASSWORD: ${{ secrets.SUPERNOVA_KEY_PASSWORD }}
          SUPERNOVA_CERT_SHA256: ${{ vars.SUPERNOVA_CERT_SHA256 }}
          FOUNDATION_RELEASE_READY: ${{ vars.FOUNDATION_RELEASE_READY }}
        run: |
          set +x
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/supernova-foundation-signing"
          build_log="$RUNNER_TEMP/supernova-foundation-gradle.log"
          trap 'rm -rf -- "$signing_dir"; rm -f -- "$build_log"' EXIT
          python3 source/.github/signing/foundation_signing.py prepare
          export SUPERNOVA_SIGNING_STORE_FILE="$signing_dir/foundation.p12"
          unset SUPERNOVA_P12_BASE64
          cd nova/Video
          chmod +x gradlew
          if ! ./gradlew assembleNoamazonRelease -PfoundationRelease -Puniversal --no-daemon --no-build-cache --no-configuration-cache > "$build_log" 2>&1; then
            echo 'Foundation release build failed. Raw Gradle logs are not published because signing secrets were in scope.'
            exit 1
          fi

      - name: Verify signed package and public evidence before allowlisted upload
        if: inputs.operation == 'prepare'
        env:
          SUPERNOVA_CERT_SHA256: ${{ vars.SUPERNOVA_CERT_SHA256 }}
        run: |
          set -euo pipefail
          # Use the same explicitly installed/reviewed tools as unsigned conformance.
          # Build Tools 37 changed certificate labels; never silently select newest.
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          python3 source/.github/signing/verify_foundation_apk.py \
            --directory nova/Video/build/outputs/apk/noamazon/release \
            --apksigner "$build_tools/apksigner" \
            --apkanalyzer "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" \
            --source nova/Video \
            --aapt2 "$build_tools/aapt2" \
            --native-evidence "$RUNNER_TEMP/supernova-foundation-ffmpeg/verified-native-build.json" \
            --publish "$RUNNER_TEMP/supernova-foundation-publish"

      - name: Always remove temporary signing material
        if: always()
        run: |
          python3 source/.github/signing/foundation_signing.py cleanup
          rm -f -- "$RUNNER_TEMP/supernova-foundation-gradle.log"

      - name: Upload verified Foundation APK and public evidence only
        if: success() && inputs.operation == 'prepare'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supernova-foundation-release
          path: |
            ${{ runner.temp }}/supernova-foundation-publish/Supernova-Foundation.apk
            ${{ runner.temp }}/supernova-foundation-publish/public-build-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload corresponding FFmpeg source and public native evidence
        if: success() && inputs.operation == 'prepare'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supernova-foundation-ffmpeg-source
          path: |
            ${{ runner.temp }}/supernova-foundation-ffmpeg/Supernova-Foundation-FFmpeg-Source.tar.xz
            ${{ runner.temp }}/supernova-foundation-ffmpeg/verified-native-build.json
            ${{ runner.temp }}/supernova-foundation-ffmpeg/native-runtime-regression.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload public unsigned conformance evidence only
        if: success() && inputs.operation == 'verify'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supernova-foundation-unsigned-conformance
          path: |
            ${{ runner.temp }}/supernova-foundation-conformance.json
            ${{ runner.temp }}/supernova-foundation-ffmpeg/verified-native-build.json
            ${{ runner.temp }}/supernova-foundation-ffmpeg/native-runtime-regression.json
          if-no-files-found: error
          retention-days: 30
