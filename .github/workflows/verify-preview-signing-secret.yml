name: Verify durable Preview signing secret
on:
  push:
    branches: ['codex/apk-build-fixes']
    paths: ['.github/workflows/verify-preview-signing-secret.yml']
permissions:
  contents: read
jobs:
  verify-durable:
    if: github.ref == 'refs/heads/codex/apk-build-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify signing identity from durable secret without cache
        env:
          STORED_KEY_BASE64: ${{ secrets.NOVA_SIGNING_KEY_BASE64 }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          work=$(mktemp -d "$RUNNER_TEMP/signing-verification.XXXXXX")
          python3 - "$work/recovered.keystore" <<'PY'
          import base64, os, pathlib, sys
          try:
              value = os.environ.pop("STORED_KEY_BASE64", "")
              if not value: raise ValueError()
              data = base64.b64decode(value, validate=True)
              if not data: raise ValueError()
              pathlib.Path(sys.argv[1]).write_bytes(data)
          except Exception:
              print("::error::Durable secret decoding failed; values suppressed.")
              sys.exit(1)
          PY
          unset STORED_KEY_BASE64
          python3 - "$work/store-password" <<'PY'
          import pathlib, sys
          pathlib.Path(sys.argv[1]).write_bytes(bytes([97,110,100,114,111,105,100]))
          PY
          if ! keytool -exportcert -keystore "$work/recovered.keystore" -alias androiddebugkey -storepass:file "$work/store-password" -file "$work/certificate.der" > "$work/keytool.log" 2>&1; then
            echo "::error::Keystore certificate export failed; no signing material changed."
            exit 1
          fi
          expected=89ac087ed6f989c90482d4a999f80511fe6ceee26ef1b9c37a142a9f00d39a5a
          actual=$(sha256sum "$work/certificate.der" | cut -d ' ' -f 1)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Certificate mismatch; recovery stopped without cache writes."
            exit 1
          fi
          cat > "$work/VerifyKey.java" <<'JAVA'
          import java.io.*;
          import java.nio.file.*;
          import java.security.*;
          import java.util.*;
          public class VerifyKey {
            public static void main(String[] args) throws Exception {
              char[] password = {97,110,100,114,111,105,100};
              KeyStore store = KeyStore.getInstance(new File(args[0]), password);
              if (!store.isKeyEntry("androiddebugkey")) throw new Exception("Private key absent");
              Key key = store.getKey("androiddebugkey", password);
              Arrays.fill(password, '\0');
              if (!(key instanceof PrivateKey)) throw new Exception("Private key unavailable");
              byte[] challenge = new byte[32];
              new SecureRandom().nextBytes(challenge);
              Signature signer = Signature.getInstance("SHA256withRSA");
              signer.initSign((PrivateKey)key);
              signer.update(challenge);
              byte[] signature = signer.sign();
              signer.initVerify(store.getCertificate("androiddebugkey"));
              signer.update(challenge);
              if (!signer.verify(signature)) throw new Exception("Private-key verification failed");
              System.out.println("Private-key challenge verification: PASS");
            }
          }
          JAVA
          if ! java "$work/VerifyKey.java" "$work/recovered.keystore" > "$work/private-key-check.log" 2>&1; then
            echo "::error::Private-key usability check failed; no signing material changed."
            exit 1
          fi
          echo "Independent durable secret reconstruction: PASS"
          echo "Certificate SHA-256: $actual"
          echo "Private-key challenge verification: PASS"
          echo "Durable secret fingerprint and private-key verification: PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary recovery token only after independent verification
        env:
          GH_TOKEN: ${{ secrets.NOVA_RECOVERY_SECRETS_TOKEN }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess, sys
          def fail():
              print("::error::Temporary recovery token removal could not be confirmed; manual removal required.")
              sys.exit(1)
          try:
              if not os.environ.get("GH_TOKEN"): fail()
              repo = "heretoecode/Supernova"
              result = subprocess.run(["gh", "secret", "delete", "NOVA_RECOVERY_SECRETS_TOKEN", "--repo", repo, "--app", "actions"], capture_output=True)
              if result.returncode: fail()
              listing = subprocess.run(["gh", "secret", "list", "--repo", repo, "--app", "actions", "--json", "name"], capture_output=True)
              if listing.returncode: fail()
              names = {x["name"] for x in json.loads(listing.stdout)}
              if "NOVA_RECOVERY_SECRETS_TOKEN" in names or "NOVA_SIGNING_KEY_BASE64" not in names: fail()
              print("Temporary repository secret NOVA_RECOVERY_SECRETS_TOKEN removed: PASS")
              print("Durable repository secret NOVA_SIGNING_KEY_BASE64 retained: PASS")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
                  out.write("\nTemporary recovery-token secret removed and durable signing secret retained. No APK build performed.\n")
          except Exception:
              fail()
          PY
