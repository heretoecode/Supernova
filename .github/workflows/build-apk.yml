name: Build NOVA APK

on:
  push:
    branches: [v6.4]
  pull_request:
    branches: [v6.4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_HOME: ${ANDROID_NDK_LATEST_HOME}
      ANDROID_NDK_ROOT: ${ANDROID_NDK_LATEST_HOME}

    steps:
      # MediaLib builds native AVOS code. The v6.4 manifest is the supported
      # way to obtain its complete native dependency graph and prebuilts.
      - name: Install NOVA build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file git maven meson nasm ninja-build pkg-config unzip wget

      - name: Install repo tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo | sudo tee /usr/local/bin/repo > /dev/null
          sudo chmod a+x /usr/local/bin/repo

      - name: Check out complete NOVA v6.4 source tree
        run: |
          mkdir nova
          cd nova
          repo init -u https://github.com/nova-video-player/aos-AVP -b nova -m v6_4.xml
          repo sync -j 4
          repo forall -c 'git checkout -t $REPO_REMOTE/$REPO_RREV'

      # Replace only the two projects we changed with the corresponding forks.
      - name: Overlay Video fork
        working-directory: nova/Video
        run: |
          git remote add heretoecode https://github.com/heretoecode/aos-Video.git
          git fetch heretoecode v6.4
          git checkout --detach heretoecode/v6.4

      - name: Overlay MediaLib fork
        working-directory: nova/MediaLib
        run: |
          git remote add heretoecode https://github.com/heretoecode/aos-MediaLib.git
          git fetch heretoecode v6.4
          git checkout --detach heretoecode/v6.4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build debug APK
        working-directory: nova/Video
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: nova/gradle-build.log
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-debug-apk
          path: nova/Video/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
